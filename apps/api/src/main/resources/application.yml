spring:
  application:
    name: productivity-os-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/productivity_os}
    username: ${DB_USER:productivity}
    password: ${DB_PASSWORD:productivity}
  jpa:
    hibernate:
      # Schema of record is the Flyway migration set (ADR-003).
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # ISO-8601 representations in API contracts (ADR-005, ADR-006).
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  cors:
    # Comma-separated exact frontend origins allowed for credentialed
    # cross-origin requests (Vercel production). Set FRONTEND_ORIGINS in
    # Cloud Run. Never use "*" while allowCredentials=true. The Vite dev
    # proxy normally keeps localhost same-origin; the default below only
    # covers direct cross-origin dev access.
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  auth:
    # SameSite policy for the HttpOnly refresh-token cookie. Strict suits
    # same-site local development; production must use None because the
    # frontend (Vercel) and backend (Cloud Run) are different sites. Secure
    # and HttpOnly remain true regardless.
    cookie-same-site: ${COOKIE_SAME_SITE:Strict}
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-secret-at-least-256-bits-long-for-hmac-sha256}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:1}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
