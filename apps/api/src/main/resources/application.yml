spring:
  application:
    name: productivity-os-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/productivity_os}
    username: ${DB_USER:productivity}
    password: ${DB_PASSWORD:productivity}
  jpa:
    hibernate:
      # Schema of record is the Flyway migration set (ADR-003).
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # ISO-8601 representations in API contracts (ADR-005, ADR-006).
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-secret-at-least-256-bits-long-for-hmac-sha256}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
