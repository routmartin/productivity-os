org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
kotlin.code.style=official

# JDK 21 toolchain location (Homebrew keg-only openjdk@21). Lets Gradle's
# Java toolchain find JDK 21 without a system-wide symlink (Plan 001, Step 1).
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

# Override Testcontainers version managed by Spring Boot (docker-java 3.3.6
# incompatible with Docker Engine 29.x).
testcontainers.version=1.21.4
